<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo - Cepillos Cloud</title>
    <link rel="stylesheet" href="../css/catalogo.css">
</head>
<body>
    <div class="container">
        <header class="catalogo-header">
            <div class="header-content">
                <a href="../index.html" class="logo-link">
                    <span class="logo-icon">🧹</span>
                    <span class="logo-text">Cepillos Cloud</span>
                </a>
                <h1>Catálogo de Productos</h1>
                <a href="../index.html" id="volver" class="btn-volver">← Volver al inicio</a>
            </div>
        </header>

        <section class="tabla-section">
            <div class="tabla-wrapper">
                <table id="tablaProductos">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Marca</th>
                            <th>Precio</th>
                        </tr>
                    </thead>
                    <tbody id="cuerpoTabla">

                    </tbody>
                </table>
            </div>
            <div id="mensajeEstado" class="mensaje-estado"></div>
        </section>

        <footer class="catalogo-footer">
            <p>© 2026 Cepillos Cloud - Todos los derechos reservados</p>
            <p>Proyecto de Computación en la Nube</p>
        </footer>
    </div>

    <script src="../javascript/js.js"></script>
</body>
</html>
